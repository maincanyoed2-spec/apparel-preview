; Apparel Preview starting settings.
;
; The FOMOD writes this file from the option you pick at install time.
; These are starting values only. Apparel Preview writes in any key that is
; missing here on first run, and you can change any of them in game from the
; FLICK panel or by editing this file.

[General]
; Preview the apparel row you are hovering, without pressing the preview key.
; One automatic preview is shown at a time.
;
; false = press the preview key (C by default) to preview what is highlighted.
; Press it on more than one piece to build up a whole outfit.
; true  = moving onto a row previews that one piece by itself, no key press.
bPreviewOnHover = false
